name: Inspect EAS Build Logs

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'EAS Build ID to inspect'
        required: true
        default: 'f4b6bf9e-9251-4891-91fe-4c4caf2bd40a'

jobs:
  inspect:
    name: Fetch and Output EAS Build Logs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch Build Logs
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN || secrets.EXPO_TOKEN }}
          BUILD_ID: ${{ github.event.inputs.build_id }}
        run: |
          node authentichadithapp/scripts/fetch-build-log.mjs "$BUILD_ID"
